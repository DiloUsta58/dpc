<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chargen-Daten</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/favicon.ico">
</head>
<body class="weing-page weing-data-page chargen-data-page">
  <div class="page-wrap">
    <div class="page">
      <div class="date-line"><span>Datum:</span><span class="line current-date"></span></div>

      <div class="weing-data-header">
        <div class="weing-data-header-top">
          <button id="chargenBackBtn" type="button">Zurück</button>
          <button id="chargenAddBtn" type="button">Charge hinzufügen</button>
          <button id="chargenRemoveBtn" type="button">Charge Entfernen</button>
          <div class="weing-data-search">
            <label for="chargeSearch">Suche:</label>
            <input id="chargeSearch" type="search" placeholder="Charge oder Material…" />
          </div>
        </div>
      </div>

      <div class="weing-data-grid">
        <div class="weing-data-right" style="grid-column: 1 / -1;">
          <table class="weing-data-table">
            <thead>
              <tr>
                <th colspan="3">Chargen-Daten (Wareneingang)</th>
              </tr>
              <tr>
                <th style="width: 20%;">Charge</th>
                <th style="width: 50%;">Material</th>
                <th style="width: 30%;">Erste Sichtung</th>
              </tr>
            </thead>
            <tbody id="chargeTableBody">
              <!-- Wird per JS gefüllt -->
            </tbody>
          </table>
        </div>
      </div>

      <footer>
        <div id="kimlik">© Dilaver Bölükbaşı</div>
        <div id="lastUpdate"></div>
        <span id="footerVersion">Version: …</span>
      </footer>
    </div>
  </div>
  <script src="js/dpc.js" defer></script>
</body>
</html>
