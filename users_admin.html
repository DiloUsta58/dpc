<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benutzerverwaltung</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/favicon.ico">
  <style>
    .users-admin-page .page-wrap {
      align-items: flex-start;
    }
    .users-admin-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 10px;
      flex-wrap: wrap;
    }
    .users-admin-status {
      font-size: var(--fs-info);
      color: var(--text-muted);
      min-height: 18px;
    }
    .users-admin-status.error {
      color: #ffb0b0;
    }
    .users-admin-status.ok {
      color: #9fe0b0;
    }
    .users-admin-table th,
    .users-admin-table td {
      text-align: left;
    }
    .users-admin-table td:nth-child(2) {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12px;
    }
    .users-admin-table td:nth-child(4),
    .users-admin-table td:nth-child(5) {
      text-align: center;
    }
    .users-admin-table select {
      border: 1px solid #3a3a3a;
      background: #313131;
      color: #f5f5f5;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: var(--fs-btn);
    }
  </style>
</head>
<body class="index-page index-color-font users-admin-page">
  <div class="page-wrap">
    <div class="page">
      <div class="date-line"><span>Datum:</span><span class="line current-date"></span></div>

      <div class="users-admin-toolbar">
        <button id="usersAdminBackBtn" type="button">Zurück</button>
        <button id="usersAdminReloadBtn" type="button">Neu laden</button>
        <button id="usersAdminResetBtn" type="button">Overrides zurücksetzen</button>
        <span id="usersAdminStatus" class="users-admin-status" aria-live="polite"></span>
      </div>

      <h1 class="index-title">Benutzerverwaltung</h1>

      <table class="tight users-admin-table">
        <thead>
          <tr>
            <th style="width: 16%;">Typ</th>
            <th style="width: 36%;">User-Hash</th>
            <th style="width: 16%;">Rolle</th>
            <th style="width: 14%;">Aktiv</th>
            <th style="width: 18%;">Aktion</th>
          </tr>
        </thead>
        <tbody id="usersAdminBody">
        </tbody>
      </table>

      <footer>
        <div id="kimlik">© Dilaver Bölükbaşı</div>
        <div id="lastUpdate"></div>
        <span id="footerVersion">Version: …</span>
      </footer>
    </div>
  </div>

  <script src="js/auth_config.js"></script>
  <script src="js/users_admin.js"></script>
</body>
</html>
