<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/favicon.ico">
  <style>
    .login-page .page-wrap {
      min-height: 100vh;
      align-items: center;
    }
    .login-card {
      width: min(520px, calc(100vw - 24px));
      padding: 18px;
      border: 1px solid #3a3a3a;
      border-radius: 14px;
      background: #2b2b2b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .login-title {
      margin: 0 0 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #f5f5f5;
    }
    .login-form {
      display: grid;
      gap: 10px;
    }
    .login-form label {
      font-size: 14px;
      color: #d6dbe6;
    }
    .login-form input {
      width: 100%;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 8px 10px;
      background: #313131;
      color: #f5f5f5;
      font-size: 14px;
      font-family: inherit;
    }
    .login-form input:focus {
      outline: none;
      border-color: #8aa9ff;
      box-shadow: 0 0 0 2px rgba(138, 169, 255, 0.22);
    }
    .login-actions {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .login-actions button {
      border: 1px solid #3a3a3a;
      background: #313131;
      color: #f5f5f5;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-actions button:hover {
      background: #3a3a3a;
    }
    .login-msg {
      min-height: 20px;
      font-size: 13px;
      color: #ffb0b0;
    }
    .login-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #d6dbe6;
    }
  </style>
</head>
<body class="index-page index-color-font login-page">
  <div class="page-wrap">
    <div class="login-card">
      <h1 class="login-title">Anmeldung</h1>
      <form id="loginForm" class="login-form" autocomplete="off">
        <div>
          <label for="loginUser">Benutzername</label>
          <input id="loginUser" name="username" type="text" required />
        </div>
        <div>
          <label for="loginPassword">Passwort</label>
          <input id="loginPassword" name="password" type="password" required />
        </div>
        <div class="login-actions">
          <button id="loginBtn" type="submit">Login</button>
          <span id="loginMsg" class="login-msg" aria-live="polite"></span>
        </div>
      </form>
      <div class="login-hint">Standard: <b>user</b> / Passwort <b>logistikhzl</b></div>
    </div>
  </div>

  <script src="js/auth_config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
