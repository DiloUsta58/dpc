<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waren­eingang Vorschau</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/favicon.ico">
</head>
<body class="weing-page weing-data-page">
  <div class="page-wrap">
    <div class="page">
      <div class="date-line"><span>Datum:</span><span class="line current-date"></span></div>

      <div class="weing-data-header">
        <div class="weing-data-header-top">
          <div class="left-buttons">
            <button id="weingDataBackBtn" type="button">Zurück</button>
            <a id="weingDataOpenWeing" class="weing-data-link" href="weing.html">Wahreneingang öffnen</a>
          </div>
        </div>

        <div class="weing-data-kw">
          <label for="weingDataKwSelect">Woche wählen:</label>
          <select id="weingDataKwSelect"></select>
        </div>
      </div>

      <div class="weing-data-grid">
        <div class="weing-data-left">
          <table class="weing-data-table">
            <thead>
              <tr>
                <th id="weingDataKwTitle">Kalenderwoche</th>
              </tr>
            </thead>
            <tbody id="weingDataDaysBody">
              <!-- Wird per JS gefüllt -->
            </tbody>
          </table>
        </div>

        <div class="weing-data-right">
          <table class="weing-data-table">
            <thead>
              <tr>
                <th colspan="5">Vorschau (ersten 10 Einträge)</th>
              </tr>
              <tr>
                <th style="width: 10%;">Abt.</th>
                <th style="width: 30%;">Material</th>
                <th style="width: 28%;">Charge</th>
                <th style="width: 12%;">Pal. Nr.</th>
                <th style="width: 20%;">Menge / Stk.</th>
              </tr>
            </thead>
            <tbody id="weingDataPreviewBody">
              <!-- Wird per JS gefüllt -->
            </tbody>
          </table>
        </div>
      </div>

      <footer>
        <div id="kimlik">© Dilaver Bölükbaşı</div>
        <div id="lastUpdate"></div>
        <span id="footerVersion">Version: …</span>
      </footer>
    </div>
  </div>
  <script src="js/dpc.js" defer></script>
</body>
</html>
